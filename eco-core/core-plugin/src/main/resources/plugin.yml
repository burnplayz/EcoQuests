name: ${pluginName}
version: ${version}
main: com.willfp.ecoquests.EcoQuestsPlugin
api-version: 1.17
authors: [ Auxilor ]
website: willfp.com
load: STARTUP
depend:
  - eco


commands:
  ecoquests:
    description: Base Command
    permission: ecoquests.command.ecoquests
  quests:
    aliases:
      - q
      - quest
    description: Open the quests menu
    permission: ecoquests.command.quests

permissions:
  ecoquests.*:
    description: All ecoquests permissions
    default: op
    children:
      ecoquests.command.*: true
  ecoquests.command.*:
    description: All commands
    default: op
    children:
      ecoquests.command.reload: true
      ecoquests.command.quests: true
      ecoquests.command.start: true
      ecoquests.command.reset: true
      ecoquests.command.resetplayer: true
      ecoquests.command.addexp: true
      ecoquests.command.complete: true
      ecoquests.command.advance: true
      ecoquests.command.wipe: true
      ecoquests.command.resetplayerall: true

  ecoquests.command.reload:
    description: Allows reloading the config
    default: op
  ecoquests.command.ecoquests:
    description: Allows the use of /ecoquests.
    default: true
  ecoquests.command.quests:
    description: Allows the use of /quests.
    default: true
  ecoquests.command.start:
    description: Allows using /ecoquests start.
    default: op
  ecoquests.command.reset:
    description: Allows using /ecoquests reset.
    default: op
  ecoquests.command.resetplayer:
    description: Allows using /ecoquests resetplayer.
    default: op
  ecoquests.command.addexp:
    description: Allows using /ecoquests addexp.
    default: op
  ecoquests.command.complete:
    description: Allows using /ecoquests complete.
    default: op
  ecoquests.command.advance:
    description: Allows using /ecoquests advance.
    default: op
ecoquests.command.wipe:
    description: Allows using /ecoquests wipe.
    default: op
ecoquests.command.resetplayerall:
    description: Allows using /ecoquests resetplayerall.
    default: op